name: Whisper device test (nightly)
# The speech-model download test is too slow and flaky for per-push smoke, so it runs here
# on a schedule, with the model cached between runs and one retry. A red run here means the
# earbud listening chain is broken, not that a push is bad.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whisper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          script: |
            bash ci/fetch-deps.sh
            for try in 1 2; do
              gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jondude.anzu.WhisperDeviceTest --no-daemon && exit 0
              echo "attempt $try failed"
            done
            exit 1
