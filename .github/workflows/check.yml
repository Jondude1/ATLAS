name: Check branch
# Runs the unit tests and a release build on any non-main branch. Never publishes a release.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: bash ci/fetch-deps.sh
      - name: Unit tests
        run: gradle testReleaseUnitTest --no-daemon --stacktrace
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
